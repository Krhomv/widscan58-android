; Widscan58 handheld display: Waveshare ESP32-S3-Touch-AMOLED-2.41 (ESP32-S3R8,
; 16 MB flash, 8 MB octal PSRAM). Built by .github/workflows/handheld.yml.
; GPL-3.0-or-later.

[env:waveshare-amoled-241]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = dio  ; this board's ROM boot-loops on a QIO bootloader (XMC flash)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -O2
